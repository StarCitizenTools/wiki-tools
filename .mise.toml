[tools]
go = "1.23"
lefthook = "latest"
rust = "latest"
stylua = "latest"
"cargo:gale-lint" = "latest"
# Off-wiki ScribuntoUnit runner (provides `scribuntounit` + `scribuntounit-fetch`).
# Requires system lua5.1 + curl/wget: as of v0.2.0 the runner FETCHES the Scribunto
# lualib at setup into .scribuntounit/ (pinned via scribuntounit.config.lua's
# scribunto.ref) rather than bundling it. Do NOT add mise's lua plugin.
"github:StarCitizenTools/mediawiki-scribuntounit" = { version = "0.2.0", bin_path = "bin" }

[tasks.lint]
run = [
  "stylua --check pages/module/ tests/ scribuntounit.config.lua",
  "gale 'pages/module/**/*.css'",
  # gofmt -l only *lists* offenders and still exits 0, so test the output.
  'cd scripts && if [ -n "$(gofmt -l .)" ]; then echo "gofmt: needs formatting:"; gofmt -l .; exit 1; fi',
  "cd scripts && go vet ./...",
]
description = "Check formatting"

[tasks.fix]
run = ["stylua pages/module/ tests/ scribuntounit.config.lua", "gale --fix 'pages/module/**/*.css'", "cd scripts && gofmt -w ."]
description = "Fix formatting"

[tasks.starmap]
dir = "scripts"
run = "go run ./cmd/starmap"
description = "Regenerate the Starmap JSON into scripts/out/ (gitignored); publish it via the MediaWiki MCP server"

[tasks."starmap:diff"]
dir = "scripts"
run = "go run ./cmd/starmap -diff"
description = "Regenerate and report drift against the live wiki page (exit 1 if they differ). Read-only; deployment goes through the MediaWiki MCP server."

[tasks.uuidindex]
dir = "scripts"
run = "go run ./cmd/uuidindex"
description = "Scan the wiki and write the UUID: namespace reconciliation plan to scripts/out/ (gitignored); apply it via the MediaWiki MCP server"

[tasks."uuidindex:diff"]
dir = "scripts"
run = "go run ./cmd/uuidindex -diff"
description = "Scan and report UUID: namespace drift (exit 1 if reconciliation is pending). Read-only; changes go through the MediaWiki MCP server."

[tasks.test]
depends = ["test:lua", "test:go"]
description = "Run all local tests"

[tasks."test:go"]
dir = "scripts"
run = "go test ./..."
description = "Run the Go unit tests for scripts/ (no network access required)"

[tasks."test:lua"]
depends = ["test:lua:manifest", "test:lua:unit"]
description = "Run all Lua tests (manifest conformance + off-wiki ScribuntoUnit suites)"

[tasks."test:lua:manifest"]
run = "lua5.1 tests/manifest.lua"
description = "Validate Entity JSON config manifests for shape and cross-reference invariants"

[tasks."test:lua:fetch"]
run = "scribuntounit-fetch"
description = "Fetch the Scribunto lualib into .scribuntounit/ (cached; ref pinned in scribuntounit.config.lua). No-op once present."

[tasks."test:lua:unit"]
depends = ["test:lua:fetch"]
run = "scribuntounit"
description = "Run the ScribuntoUnit suites off-wiki via the mediawiki-scribuntounit runner (config: scribuntounit.config.lua); pass a module name to filter, e.g. mise run test:lua:unit RangeBar"
